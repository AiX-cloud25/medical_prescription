<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Prescription Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0d9488",
            "primary-deep": "#0f766e",
            accent: "#10b981",
            mint: "#f0fdf9",
            "mint-2": "#ccfbf1",
            ink: "#134e4a",
            "ink-soft": "#3f6d68",
            line: "#99f6e4",
            paper: "#ffffff",
            danger: "#dc2626",
          },
          fontFamily: { sans: ["Poppins", "sans-serif"] },
          boxShadow: {
            card: "0 4px 24px -6px rgba(13, 148, 136, 0.18)",
            glow: "0 0 0 4px rgba(16, 185, 129, 0.18)",
          },
          keyframes: {
            fadeIn: { "0%": { opacity: 0, transform: "translateY(8px)" }, "100%": { opacity: 1, transform: "translateY(0)" } },
            shimmer: { "0%": { backgroundPosition: "-400px 0" }, "100%": { backgroundPosition: "400px 0" } },
          },
          animation: { fadeIn: "fadeIn .35s ease-out", shimmer: "shimmer 1.6s linear infinite" },
        },
      },
    };
  </script>
  <style>
    body { font-family: "Poppins", sans-serif; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f0fdf9; }
    ::-webkit-scrollbar-thumb { background: #5eead4; border-radius: 8px; }
    .shimmer-bar {
      background: linear-gradient(90deg, #e6f7f3 25%, #d2f0e8 50%, #e6f7f3 75%);
      background-size: 800px 100%;
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body class="bg-mint min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    /* ═══ Per-project constants — ONLY these (and <title>) differ between the
       three sibling projects. Structure and colors stay identical. ═══ */
    const APP_TITLE = "Offline Prescription Extractor";

    /*
     * BASE — auto-detects the proxy path prefix on Jarvis Labs / RunPod.
     * When Jarvis proxies port 8002 it serves the app at a URL like:
     *   https://<id>-8002.proxy.runpod.net/          (no path prefix)
     * or sometimes:
     *   https://<host>/proxy/8002/                   (path prefix)
     *
     * We strip any trailing slash so every API call becomes BASE + "/api/..."
     * which works correctly in both local (BASE="") and proxied environments.
     *
     * FastAPI also sets a root_path via --proxy-headers so its own links
     * are consistent, but the frontend needs to know the prefix too.
     */
    const BASE = (() => {
      // If the page was served from a sub-path, use that as prefix.
      // e.g. pathname = "/proxy/8002/" → prefix = "/proxy/8002"
      // e.g. pathname = "/"           → prefix = ""
      const p = window.location.pathname.replace(/\/(index\.html)?$/, "");
      return p || "";
    })();

    const api = (path) => BASE + path;  // usage: fetch(api("/api/health"))

    const STEPS = [
      { n: 1, label: "Upload", icon: "upload_file" },
      { n: 2, label: "Review", icon: "plagiarism" },
      { n: 3, label: "Structured Data", icon: "table_chart" },
    ];

    /* ── Header ──────────────────────────────────────────────── */
    function Header({ engine, onDictionary }) {
      return (
        <header className="bg-gradient-to-r from-primary to-accent shadow-card">
          <div className="max-w-6xl mx-auto px-6 py-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div className="flex items-center gap-4">
              <div className="w-12 h-12 rounded-full bg-white/20 backdrop-blur flex items-center justify-center">
                <span className="material-symbols-outlined text-white text-3xl">prescriptions</span>
              </div>
              <div>
                <h1 className="text-white text-2xl font-bold tracking-tight">{APP_TITLE}</h1>
                <p className="text-white/85 text-sm font-light">Doctor prescription → raw text → structured data</p>
              </div>
            </div>
            <div className="flex items-center gap-2 self-start sm:self-auto">
              <button
                onClick={onDictionary}
                className="inline-flex items-center gap-1.5 text-xs font-medium text-white bg-white/15 border border-white/30 rounded-full px-3.5 py-1.5 hover:bg-white/25 transition"
                title="Learned spelling dictionary — every correction grouped by the verified word"
              >
                <span className="material-symbols-outlined text-base">menu_book</span>
                Dictionary
              </button>
              {engine && (
                <span className="inline-flex items-center gap-1.5 text-xs font-medium text-white bg-white/15 border border-white/30 rounded-full px-3.5 py-1.5">
                  <span className="material-symbols-outlined text-base">memory</span>
                  {engine}
                </span>
              )}
            </div>
          </div>
        </header>
      );
    }

    /* ── Learned spelling dictionary panel ───────────────────── */
    function DictionaryPanel({ onClose }) {
      const [state, setState] = useState({ status: "loading", entries: [], error: "" });

      useEffect(() => {
        fetch(api("/api/dictionary"))
          .then(async (r) => {
            const body = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
            setState({ status: "done", entries: body.entries || [], error: "" });
          })
          .catch((e) => setState({ status: "error", entries: [], error: String(e.message || e) }));
      }, []);

      return (
        <div className="max-w-5xl mx-auto mb-8 animate-fadeIn">
          <div className="bg-paper rounded-2xl shadow-card overflow-hidden">
            <div className="px-6 py-4 border-b border-line/60 flex items-center gap-3">
              <span className="material-symbols-outlined text-primary">menu_book</span>
              <h3 className="text-ink font-semibold">Learned Spelling Dictionary</h3>
              <span className="text-xs text-ink-soft">misspelling variants grouped by the human-verified word</span>
              <button onClick={onClose} className="ml-auto text-ink-soft hover:text-ink transition" title="Close">
                <span className="material-symbols-outlined">close</span>
              </button>
            </div>
            {state.status === "loading" ? (
              <p className="text-ink-soft text-sm italic px-6 py-5">Loading…</p>
            ) : state.status === "error" ? (
              <p className="text-red-600 text-sm px-6 py-5">{state.error}</p>
            ) : state.entries.length === 0 ? (
              <p className="text-ink-soft text-sm italic px-6 py-5">
                No learned corrections yet — click Edit on the Review page, fix a word in the layout and save, and it will appear here.
              </p>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="bg-mint-2/70 text-ink">
                      {["Raw (model wrote)", "Corrected (verified)", "Confirmations", "Status"].map((h) => (
                        <th key={h} className="text-left font-semibold px-4 py-2 whitespace-nowrap">{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {state.entries.map((e, i) => (
                      <tr key={i} className="border-t border-line/40 align-top">
                        <td className="px-4 py-2 text-ink">
                          {e.variants.map((v) => `${v.raw} (${v.times}×)`).join(", ")}
                        </td>
                        <td className="px-4 py-2 font-semibold text-ink">{e.corrected}</td>
                        <td className="px-4 py-2 text-ink">{e.total}</td>
                        <td className="px-4 py-2">
                          {e.automatic ? (
                            <span className="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full px-2.5 py-0.5">
                              <span className="material-symbols-outlined text-sm">bolt</span> automatic
                            </span>
                          ) : (
                            <span className="inline-flex items-center gap-1 text-[11px] font-medium text-sky-700 bg-sky-50 border border-sky-200 rounded-full px-2.5 py-0.5">
                              <span className="material-symbols-outlined text-sm">school</span> teaching the model
                            </span>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            <p className="text-[11px] text-ink-soft italic px-6 py-3 border-t border-line/40">
              Variants pool their confirmations: once a corrected word reaches 3 total, all its
              variants are fixed automatically in code; below that they guide the AI as prompt examples.
            </p>
          </div>
        </div>
      );
    }

    /* ── Step indicator ──────────────────────────────────────── */
    function Stepper({ step }) {
      return (
        <div className="flex items-center justify-center gap-0 py-8">
          {STEPS.map((s, i) => (
            <React.Fragment key={s.n}>
              {i > 0 && (
                <div className={"h-0.5 w-14 sm:w-24 " + (step >= s.n ? "bg-primary" : "bg-line")} />
              )}
              <div className="flex flex-col items-center gap-1.5 px-2">
                <div className={
                  "w-11 h-11 rounded-full flex items-center justify-center border-2 transition-all " +
                  (step > s.n
                    ? "bg-primary border-primary text-white"
                    : step === s.n
                      ? "bg-white border-primary text-primary shadow-glow"
                      : "bg-white border-line text-ink-soft/50")
                }>
                  <span className="material-symbols-outlined text-xl">{step > s.n ? "check" : s.icon}</span>
                </div>
                <span className={"text-xs font-semibold " + (step >= s.n ? "text-ink" : "text-ink-soft/50")}>
                  {s.label}
                </span>
              </div>
            </React.Fragment>
          ))}
        </div>
      );
    }

    /* ── Status chip ─────────────────────────────────────────── */
    function StatusChip({ status }) {
      const map = {
        queued:     { cls: "bg-amber-100 text-amber-700 border-amber-200", label: "Queued" },
        extracting: { cls: "bg-sky-100 text-sky-700 border-sky-200", label: "Extracting…" },
        processed:  { cls: "bg-mint-2 text-primary-deep border-line", label: "Processed" },
        error:      { cls: "bg-red-50 text-danger border-red-200", label: "Error" },
      };
      const s = map[status] || map.queued;
      return (
        <span className={"inline-flex items-center text-[11px] font-semibold rounded-full border px-2.5 py-0.5 whitespace-nowrap " + s.cls}>
          {s.label}
        </span>
      );
    }

    /* ── Page 1 — Upload (multi-file, auto-queued) ───────────── */
    function UploadPage({ docs, onFilesAdded, onView }) {
      const [dragOver, setDragOver] = useState(false);
      const [error, setError] = useState("");
      const inputRef = useRef(null);

      const pick = (list) => {
        const files = Array.from(list || []);
        if (!files.length) return;
        const ok = files.filter((f) => /\.(jpe?g|png|webp|pdf)$/i.test(f.name));
        if (!ok.length) { setError("Unsupported file. Upload JPG, PNG or WEBP images, or PDFs."); return; }
        setError(ok.length < files.length ? "Some files were skipped — only JPG, PNG, WEBP and PDF are supported." : "");
        onFilesAdded(ok);
      };

      const processedCount = docs.filter((d) => d.status === "processed").length;
      const busyCount = docs.filter((d) => d.status === "queued" || d.status === "extracting").length;

      return (
        <div className="animate-fadeIn max-w-3xl mx-auto">
          <div
            className={
              "bg-paper rounded-3xl shadow-card border-2 border-dashed p-10 text-center transition-all cursor-pointer " +
              (dragOver ? "border-accent bg-mint-2/60 shadow-glow" : "border-line hover:border-accent/70")
            }
            onClick={() => inputRef.current && inputRef.current.click()}
            onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={(e) => { e.preventDefault(); setDragOver(false); pick(e.dataTransfer.files); }}
          >
            <input
              ref={inputRef} type="file" className="hidden" multiple
              accept=".jpg,.jpeg,.png,.webp,.pdf,image/*,application/pdf"
              onChange={(e) => { pick(e.target.files); e.target.value = ""; }}
            />
            <div className="w-20 h-20 mx-auto rounded-full bg-mint-2 flex items-center justify-center mb-5">
              <span className="material-symbols-outlined text-primary text-5xl">cloud_upload</span>
            </div>
            <h2 className="text-ink text-xl font-semibold mb-1">Upload prescriptions</h2>
            <p className="text-ink-soft text-sm mb-6">Drag &amp; drop images or PDFs here, or click to browse — extraction starts automatically, one document at a time</p>
            <button
              type="button"
              className="rounded-full bg-gradient-to-r from-primary to-accent text-white font-semibold text-sm px-8 py-3 shadow-card hover:opacity-90 transition"
              onClick={(e) => { e.stopPropagation(); inputRef.current && inputRef.current.click(); }}
            >
              Browse Files
            </button>
            <p className="text-ink-soft/70 text-xs mt-5">Supported: JPG · PNG · WEBP · PDF — multiple files allowed</p>
          </div>

          {docs.length > 0 && (
            <div className="animate-fadeIn mt-6 bg-paper rounded-2xl shadow-card overflow-hidden">
              <div className="px-5 py-3.5 border-b border-line/60 flex items-center gap-2">
                <span className="material-symbols-outlined text-primary">folder_open</span>
                <h3 className="text-ink font-semibold text-sm">Documents</h3>
                <span className="text-xs text-ink-soft ml-1">
                  {processedCount} processed{busyCount ? ` · ${busyCount} in progress` : ""}
                </span>
                <button
                  onClick={onView}
                  className="ml-auto rounded-full bg-gradient-to-r from-primary to-accent text-white font-semibold text-xs px-5 py-2 shadow-card hover:opacity-90 transition flex items-center gap-1.5"
                >
                  View Extractions <span className="material-symbols-outlined text-base">arrow_forward</span>
                </button>
              </div>
              <ul className="divide-y divide-line/40">
                {docs.map((d) => (
                  <li key={d.id} className="px-5 py-3 flex items-center gap-4">
                    {/\.pdf$/i.test(d.file.name) ? (
                      <div className="w-12 h-12 rounded-lg bg-mint-2 flex items-center justify-center shrink-0">
                        <span className="material-symbols-outlined text-primary text-2xl">picture_as_pdf</span>
                      </div>
                    ) : (
                      <img src={URL.createObjectURL(d.file)} alt="preview"
                           className="w-12 h-12 rounded-lg object-cover border border-line shrink-0" />
                    )}
                    <div className="min-w-0 flex-1">
                      <p className="text-ink font-medium text-sm truncate">{d.file.name}</p>
                      <p className="text-ink-soft text-xs">{(d.file.size / 1024).toFixed(1)} KB</p>
                    </div>
                    {d.status === "extracting" && (
                      <span className="w-4 h-4 border-2 border-primary/30 border-t-primary rounded-full animate-spin inline-block" />
                    )}
                    <StatusChip status={d.status} />
                  </li>
                ))}
              </ul>
            </div>
          )}

          {error && (
            <div className="animate-fadeIn mt-6 bg-red-50 border border-red-200 text-danger rounded-2xl p-4 text-sm flex items-start gap-2">
              <span className="material-symbols-outlined text-xl shrink-0">error</span>
              <span className="whitespace-pre-wrap break-words">{error}</span>
            </div>
          )}
        </div>
      );
    }

    /* ── Layout reconstruction + structured-data helpers ─────── */
    function buildLayoutDoc(fragment, forExport) {
      // Export capture uses html2canvas, whose internal clone iframe is blocked
      // by default-src 'none' (implies frame-src 'none') — so the export doc
      // denies every dangerous vector explicitly but leaves frames unrestricted.
      const csp = forExport
        ? "script-src 'none'; connect-src 'none'; object-src 'none'; media-src 'none'; font-src 'none'; form-action 'none'; style-src 'unsafe-inline'; img-src data:"
        : "default-src 'none'; style-src 'unsafe-inline'; img-src data:";
      return (
        "<!DOCTYPE html><html><head>" +
        "<meta http-equiv=\"Content-Security-Policy\" content=\"" + csp + "\">" +
        "<style>" +
        "body { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; color: #1f2937; background: #fff; padding: 16px; margin: 0; }" +
        "table { border-collapse: collapse; margin: 6px 0; clear: both; }" +
        ".checklist { border: 1.5px solid #64748b; border-radius: 6px; padding: 8px 10px; margin: 6px 0; }" +
        "td, th { border: 1px solid #cbd5e1; padding: 4px 8px; font-size: 12px; }" +
        ".hw { font-family: inherit; color: inherit; }" +
        ".stamp { display: inline-block; border: 1.5px dashed #9333ea; color: #9333ea; border-radius: 6px; padding: 2px 8px; font-size: 11px; transform: rotate(-2deg); margin: 2px; }" +
        ".unc { background: #fde047; outline: 1.5px solid #f59e0b; border-radius: 3px; padding: 0 2px; font-weight: 600; }" +
        "img.cut { max-width: 100%; height: auto; border-radius: 4px; }" +
        "img.cut:not([src]) { border: 1.5px dashed #9333ea; color: #9333ea; border-radius: 6px; padding: 2px 8px; font-size: 11px; min-height: 18px; }" +
        "</style></head><body>" + fragment + "</body></html>"
      );
    }

    function LayoutFrame({ html, editable, frameRef, keyActionsRef }) {
      // View mode: fully sandboxed (no scripts, no same-origin access).
      // Edit mode: allow-same-origin ONLY — still no allow-scripts, and the
      // CSP (default-src 'none') keeps blocking scripts/network inside the
      // frame; the parent needs same-origin just to reach contentDocument.
      return (
        <iframe
          key={editable ? "edit" : "view"}
          ref={frameRef || undefined}
          sandbox={editable ? "allow-same-origin" : ""}
          srcDoc={buildLayoutDoc(html)}
          onLoad={() => {
            if (!editable || !frameRef || !frameRef.current) return;
            try {
              const idoc = frameRef.current.contentDocument;
              if (!idoc || !idoc.body) return;
              idoc.body.contentEditable = "true";
              idoc.body.spellcheck = false;
              idoc.body.style.outline = "none";
              idoc.body.focus();
              idoc.addEventListener("keydown", (e) => {
                const acts = (keyActionsRef && keyActionsRef.current) || {};
                if (e.key === "Escape" && acts.cancel) { e.preventDefault(); acts.cancel(); }
                if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && acts.save) { e.preventDefault(); acts.save(); }
              });
            } catch (err) { /* editing unavailable — Save will report it */ }
          }}
          title="reconstructed layout"
          className={
            "w-full h-[480px] bg-white rounded-lg border " +
            (editable ? "border-amber-400 ring-2 ring-amber-200" : "border-line")
          }
        />
      );
    }

    /* ── Edit-in-layout helpers ───────────────────────────────── */

    // Re-sanitize user-edited layout HTML before storing it (DOMParser
    // never executes scripts; the server sanitized the original already).
    function sanitizeFragment(html) {
      const doc = new DOMParser().parseFromString("<div>" + (html || "") + "</div>", "text/html");
      doc.querySelectorAll("script,style,iframe,object,embed,link,meta,form,input,select,textarea,button").forEach((el) => el.remove());
      doc.body.querySelectorAll("*").forEach((el) => {
        Array.from(el.attributes).forEach((at) => {
          const n = at.name.toLowerCase();
          const v = String(at.value || "").trim().toLowerCase();
          if (n.startsWith("on") || v.startsWith("javascript:")) el.removeAttribute(at.name);
          else if ((n === "src" || n === "href") && !v.startsWith("data:image/")) el.removeAttribute(at.name);
        });
      });
      const wrap = doc.body.firstElementChild;
      return (wrap ? wrap.innerHTML : doc.body.innerHTML).trim();
    }

    // Visible-text tokens of a layout fragment, in reading order.
    function htmlTokens(html) {
      const doc = new DOMParser().parseFromString("<div>" + (html || "") + "</div>", "text/html");
      const parts = [];
      (function walk(node) {
        node.childNodes.forEach((c) => {
          if (c.nodeType === 3) parts.push(c.nodeValue);
          else if (c.nodeType === 1) { parts.push(" "); walk(c); parts.push(" "); }
        });
      })(doc.body);
      return parts.join(" ").split(/\s+/).filter(Boolean);
    }

    // LCS diff between two token lists → word-level opcodes. Only small,
    // targeted edits are kept (spans ≤ 4 tokens — mirrors the server's
    // _MAX_DIFF_TOKENS) so a reflowed line never produces a giant replace.
    function tokenDiff(a, b) {
      const n = a.length, m = b.length, W = m + 1;
      const dp = new Int32Array((n + 1) * W);
      for (let i = n - 1; i >= 0; i--)
        for (let j = m - 1; j >= 0; j--)
          dp[i * W + j] = a[i] === b[j]
            ? dp[(i + 1) * W + j + 1] + 1
            : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
      const ops = [];
      let i = 0, j = 0, di = 0, dj = 0;
      const flush = (i2, j2) => {
        if (di === i2 && dj === j2) return;
        ops.push({
          op: di === i2 ? "insert" : dj === j2 ? "delete" : "replace",
          pred: a.slice(di, i2),
          corr: b.slice(dj, j2),
          anchor: a.slice(Math.max(0, di - 4), di),
        });
      };
      while (i < n && j < m) {
        if (a[i] === b[j]) { flush(i, j); i++; j++; di = i; dj = j; }
        else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) i++;
        else j++;
      }
      flush(n, m);
      return ops.filter((op) => op.pred.length <= 4 && op.corr.length <= 4);
    }

    // Replay layout-edit opcodes onto plain text (raw_text). Anchor-first,
    // like the server's _patch_words: locate the unchanged tokens before
    // the edit, then apply within a 300-char window. Unlocatable ops are
    // skipped. startAt limits the search to the edited page's region.
    function applyOpsToText(text, ops, startAt) {
      const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const joinRx = (toks) => toks.map(esc).join("\\s+");
      const base = Math.max(0, startAt || 0);
      let out = text;
      ops.forEach((op) => {
        const corr = op.corr.join(" ");
        let from = base, anchored = false;
        for (let k = 0; k < op.anchor.length; k++) {
          const m = out.slice(base).match(new RegExp(joinRx(op.anchor.slice(k)), "i"));
          if (m) { from = base + m.index + m[0].length; anchored = true; break; }
        }
        if (op.op === "insert") {
          if (!anchored) return; // nowhere safe to put new text
          out = out.slice(0, from) + " " + corr + out.slice(from);
          return;
        }
        const windowStr = out.slice(from, from + 300);
        let s = -1, e = -1;
        const pm = windowStr.match(new RegExp(joinRx(op.pred), "i"));
        if (pm) { s = from + pm.index; e = s + pm[0].length; }
        else {
          const gm = out.slice(base).match(new RegExp("(?<![A-Za-z0-9])" + joinRx(op.pred) + "(?![A-Za-z0-9])", "i"));
          if (!gm) return;
          s = base + gm.index; e = s + gm[0].length;
        }
        if (op.op === "delete") {
          // Swallow one adjacent space so deletions don't leave doubles.
          if (out[e] === " ") e++;
          else if (out[s - 1] === " ") s--;
          out = out.slice(0, s) + out.slice(e);
        } else {
          out = out.slice(0, s) + corr + out.slice(e);
        }
      });
      return out;
    }

    function fieldByKey(fields, key) {
      const f = (fields || []).find((x) => x.key === key);
      return f && f.value && f.value !== "(blank)" ? f.value : "";
    }

    function csvCell(v) {
      return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    }

    function exportCsv(doc) {
      const r = doc.result || {};
      const lines = [];
      lines.push(["Field", "Value", "Explanation", "Business Meaning"].map(csvCell).join(","));
      (r.fields || []).forEach((f) =>
        lines.push([f.name || f.key, f.value, f.explanation, f.business_meaning].map(csvCell).join(","))
      );
      lines.push("");
      lines.push(["Medicine", "Dosage", "Frequency", "Duration", "Instructions"].map(csvCell).join(","));
      (r.medicines || []).forEach((m) =>
        lines.push([m.medicine, m.dosage, m.frequency, m.duration, m.instructions].map(csvCell).join(","))
      );
      const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (doc.file.name.replace(/\.[^.]+$/, "") || "document") + "_structured.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    const EXPORT_PAGE_W_PX = 794; // A4 width (210mm) at 96dpi

    function pageFragment(p) {
      if (p.layout_html) return p.layout_html;
      return (
        "<pre style=\"white-space:pre-wrap;word-break:break-word;" +
        "font-family:Georgia,'Times New Roman',serif;font-size:13px;margin:0;\">" +
        escapeHtml(p.text || "(no text extracted for this page)") + "</pre>"
      );
    }

    function renderPageToCanvas(iframe, fragment) {
      return new Promise((resolve, reject) => {
        iframe.onload = async () => {
          try {
            const idoc = iframe.contentDocument;
            // Base64 stamp/signature crops must finish decoding before capture.
            await Promise.all(Array.from(idoc.images).map((img) => img.decode().catch(() => {})));
            // Grow the iframe to the full content height so nothing is clipped.
            iframe.style.height = Math.max(idoc.documentElement.scrollHeight, 100) + "px";
            await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
            const canvas = await window.html2canvas(idoc.body, {
              scale: 2,
              backgroundColor: "#ffffff",
              logging: false,
              windowWidth: EXPORT_PAGE_W_PX,
            });
            resolve(canvas);
          } catch (e) {
            reject(e);
          }
        };
        iframe.srcdoc = buildLayoutDoc(fragment, true); // set AFTER onload is attached
      });
    }

    async function downloadPdf(doc, onProgress) {
      if (!window.jspdf || !window.html2canvas) {
        throw new Error("PDF libraries failed to load from the CDN — check the network connection and reload the page.");
      }
      const pages = (doc.result && doc.result.pages) || [];
      if (!pages.length) throw new Error("No extracted pages to export.");

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4", compress: true });
      const PAGE_W = 210, PAGE_H = 297, MARGIN = 10;
      const usableW = PAGE_W - 2 * MARGIN;
      const usableH = PAGE_H - 2 * MARGIN;

      const iframe = document.createElement("iframe");
      iframe.setAttribute("sandbox", "allow-same-origin"); // deliberately NO allow-scripts
      iframe.style.cssText =
        "position:fixed;left:-10000px;top:0;width:" + EXPORT_PAGE_W_PX + "px;height:1123px;border:0;";
      document.body.appendChild(iframe);

      try {
        let firstPdfPage = true;
        for (let i = 0; i < pages.length; i++) { // sequential — bounds memory
          if (onProgress) onProgress("page " + (i + 1) + "/" + pages.length);
          const canvas = await renderPageToCanvas(iframe, pageFragment(pages[i]));
          // Content taller than one A4 page is sliced across PDF pages at full
          // width rather than shrunk to fit (dense pages stay readable).
          const sliceHpx = Math.floor((usableH / usableW) * canvas.width);
          for (let y = 0; y < canvas.height; y += sliceHpx) {
            if (!firstPdfPage) pdf.addPage();
            firstPdfPage = false;
            const hPx = Math.min(sliceHpx, canvas.height - y);
            const slice = document.createElement("canvas");
            slice.width = canvas.width;
            slice.height = hPx;
            const ctx = slice.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, slice.width, slice.height);
            ctx.drawImage(canvas, 0, y, canvas.width, hPx, 0, 0, canvas.width, hPx);
            pdf.addImage(
              slice.toDataURL("image/jpeg", 0.85), "JPEG",
              MARGIN, MARGIN, usableW, (hPx * usableW) / canvas.width,
              undefined, "FAST"
            );
          }
        }
        pdf.save((doc.file.name.replace(/\.[^.]+$/, "") || "document") + "_extracted.pdf");
      } finally {
        iframe.remove();
      }
    }

    // ── Word export ──────────────────────────────────────────────
    // Builds an MHTML (.doc) document from the reconstructed layouts.
    // Word opens MHTML natively; embedded crops travel as MIME parts
    // because Word does not reliably render data: URIs. Pure function
    // (strings in/out) so it stays testable outside the browser.
    function buildWordMht(pages) {
      const css =
        "body { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; color: #1f2937; }" +
        "table { border-collapse: collapse; margin: 6px 0; }" +
        "td, th { border: 1px solid #cbd5e1; padding: 4px 8px; font-size: 12px; }" +
        ".stamp { border: 1.5px dashed #9333ea; color: #9333ea; padding: 2px 8px; font-size: 11px; }" +
        ".unc { background: #fde047; font-weight: bold; }" +
        ".checklist { border: 1.5px solid #64748b; padding: 8px 10px; margin: 6px 0; }" +
        "img { max-width: 100%; }" +
        "h3.pg { color: #475569; font-size: 12px; border-bottom: 1px solid #cbd5e1; padding-bottom: 2px; }";
      const images = [];
      const body = pages.map((p, i) => {
        let html = pageFragment(p).replace(
          /src\s*=\s*"data:image\/(jpeg|png|gif);base64,([^"]+)"/gi,
          (m, type, b64) => {
            const name = "img" + images.length + "." + (type === "jpeg" ? "jpg" : type);
            images.push({ loc: "http://localhost/" + name, mime: "image/" + type, b64: b64 });
            return 'src="http://localhost/' + name + '"';
          }
        );
        // Word shrinks images that carry the screen layout's float /
        // max-width styles — drop them and give crops an explicit
        // readable width instead (460px ≈ 4.8in on an A4 page).
        html = html
          .replace(/(<img\b[^>]*?)\s+style\s*=\s*"[^"]*"/gi, "$1")
          .replace(/<img\b(?![^>]*\bwidth=)/gi, '<img width="460"');
        const header = pages.length > 1 ? '<h3 class="pg">Page ' + p.page + "</h3>" : "";
        const brk = i < pages.length - 1 ? '<br clear="all" style="page-break-before:always">' : "";
        return "<div>" + header + html + "</div>" + brk;
      }).join("");
      const htmlDoc =
        '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
        'xmlns:w="urn:schemas-microsoft-com:office:word">' +
        '<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8">' +
        "<style>" + css + "</style></head><body>" + body + "</body></html>";
      const B = "----=_NextPart_Extract";
      let mht =
        "MIME-Version: 1.0\r\n" +
        'Content-Type: multipart/related; boundary="' + B + '"; type="text/html"\r\n' +
        "\r\n--" + B + "\r\n" +
        'Content-Type: text/html; charset="utf-8"\r\n' +
        "Content-Location: http://localhost/doc.html\r\n" +
        "\r\n" + htmlDoc + "\r\n";
      images.forEach((im) => {
        mht +=
          "\r\n--" + B + "\r\n" +
          "Content-Type: " + im.mime + "\r\n" +
          "Content-Transfer-Encoding: base64\r\n" +
          "Content-Location: " + im.loc + "\r\n" +
          "\r\n" + im.b64.replace(/(.{76})/g, "$1\r\n") + "\r\n";
      });
      mht += "\r\n--" + B + "--\r\n";
      return mht;
    }

    function downloadWord(doc) {
      const pages = (doc.result && doc.result.pages) || [];
      if (!pages.length) { alert("No extracted pages to export."); return; }
      const mht = buildWordMht(pages);
      const blob = new Blob([mht], { type: "application/msword" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (doc.file.name.replace(/\.[^.]+$/, "") || "document") + "_extracted.doc";
      a.click();
      URL.revokeObjectURL(url);
    }

    function DocChips({ docs, selectedId, onSelect }) {

    /* ── Page 2 — Review (original / layout / structured) ────── */
    function PanelBusy({ status, error }) {
      if (status === "error") {
        return <p className="text-danger text-sm whitespace-pre-wrap break-words p-5">{error || "Extraction failed."}</p>;
      }
      return (
        <div className="flex items-center justify-center h-full min-h-[300px] gap-3 text-ink-soft text-sm">
          <span className="w-5 h-5 border-2 border-primary/30 border-t-primary rounded-full animate-spin inline-block" />
          {status === "extracting" ? "Extracting…" : "Queued — waiting for its turn"}
        </div>
      );
    }

    function ExtractionCard({ doc, onRawTextSaved, onRawTextReverted }) {
      const { file, result, status } = doc;
      const [copied, setCopied] = useState(false);
      const [pageIdx, setPageIdx] = useState(0);
      const [editing, setEditing] = useState(false);
      const [save, setSave] = useState({ status: "idle", msg: "" });
      const [pdfBusy, setPdfBusy] = useState(false);
      const [pdfNote, setPdfNote] = useState("");
      const frameRef = useRef(null);
      const keyActionsRef = useRef({});
      const url = React.useMemo(() => URL.createObjectURL(file), [file]);
      const isPdf = /\.pdf$/i.test(file.name);
      const pages = (result && result.pages) || [];
      const curIdx = Math.min(pageIdx, Math.max(pages.length - 1, 0));
      const page = pages[curIdx] || null;
      const uncCount = page && page.layout_html
        ? (page.layout_html.match(/class="[^"]*\bunc\b[^"]*"/g) || []).length
        : 0;

      const copy = async () => {
        try {
          await navigator.clipboard.writeText((result && result.raw_text) || "");
          setCopied(true);
          setTimeout(() => setCopied(false), 1600);
        } catch (e) { /* clipboard unavailable */ }
      };

      const done = status === "processed";

      function startEdit() {
        setSave({ status: "idle", msg: "" });
        setEditing(true);
      }

      function cancelEdit() {
        setEditing(false);
        setSave({ status: "idle", msg: "" });
      }

      async function saveLayoutEdit() {
        if (!page) return;
        const idoc = frameRef.current && frameRef.current.contentDocument;
        if (!idoc || !idoc.body) {
          setSave({ status: "error", msg: "Could not read the edited layout — please try again." });
          return;
        }
        setSave({ status: "saving", msg: "Saving…" });
        try {
          const editedHtml = sanitizeFragment(idoc.body.innerHTML);
          const ops = tokenDiff(htmlTokens(page.layout_html || ""), htmlTokens(editedHtml));
          const rawText = (result && result.raw_text) || "";
          // Search only inside this page's region of the document text.
          const marker = pages.length > 1 ? rawText.indexOf(`--- Page ${page.page} ---`) : 0;
          const newDocText = applyOpsToText(rawText, ops, Math.max(0, marker));
          const newPageText = applyOpsToText(page.text || "", ops, 0);

          if (newDocText === rawText) {
            // Visual-only change (e.g. removed an image) or nothing located
            // to update — keep the edit for this session, nothing to learn.
            onRawTextSaved(doc.id, rawText, [], { pageIdx: curIdx, html: editedHtml, text: page.text });
            setEditing(false);
            setSave({ status: "saved", msg: "Layout updated for this session — no text changed, so no correction was saved." });
            return;
          }

          const res = await fetch(api("/api/raw-feedback"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              doc_hash: result.doc_hash,
              filename: file.name,
              original_text: rawText,
              corrected_text: newDocText,
            }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
          onRawTextSaved(doc.id, newDocText, body.pairs || [], { pageIdx: curIdx, html: editedHtml, text: newPageText });
          setEditing(false);
          setSave({ status: "saved", msg: "Correction saved — re-uploading this file will show the corrected text." });
        } catch (e) {
          setSave({ status: "error", msg: String(e.message || e) });
        }
      }
      keyActionsRef.current = { save: saveLayoutEdit, cancel: cancelEdit };

      // Original transcription rebuilt from the page texts (the model output
      // of the last extraction) — fallback when the server has no stored one.
      function originalFromPages() {
        if (pages.length === 1) return pages[0].text || "";
        return pages.map((p) => `--- Page ${p.page} ---\n${p.text}`).join("\n\n");
      }

      async function revertRaw() {
        setSave({ status: "saving", msg: "Reverting…" });
        try {
          const res = await fetch(api(`/api/raw-feedback/${result.doc_hash}`), { method: "DELETE" });
          const body = await res.json().catch(() => ({}));
          if (!res.ok && res.status !== 404) throw new Error(body.detail || `HTTP ${res.status}`);
          // 404 = nothing stored anymore; still restore the model text locally.
          onRawTextReverted(doc.id, body.original_text || originalFromPages());
          setSave({ status: "saved", msg: "Reverted — the correction was deleted and the original text restored." });
        } catch (e) {
          setSave({ status: "error", msg: String(e.message || e) });
        }
      }

      async function handleDownloadPdf() {
        if (pdfBusy) return;
        setPdfBusy(true);
        try {
          await downloadPdf(doc, setPdfNote);
        } catch (e) {
          alert("PDF export failed: " + (e && e.message ? e.message : e));
        } finally {
          setPdfBusy(false);
          setPdfNote("");
        }
      }

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          {/* Panel 1: original uploaded document */}
          <div className="bg-paper rounded-2xl shadow-card overflow-hidden flex flex-col">
            <div className="px-5 py-3.5 border-b border-line/60 flex items-center gap-2">
              <span className="material-symbols-outlined text-primary">image</span>
              <h3 className="text-ink font-semibold text-sm">Original Document</h3>
              <span className="ml-auto text-xs text-ink-soft truncate max-w-[45%]">{file.name}</span>
            </div>
            <div className="flex-1 bg-mint-2/40 flex items-center justify-center p-3 min-h-[420px]">
              {isPdf ? (
                <iframe src={url} title="prescription" className="w-full h-[520px] rounded-lg border border-line" />
              ) : (
                <img src={url} alt="prescription" className="max-h-[520px] max-w-full rounded-lg shadow-card object-contain" />
              )}
            </div>
          </div>

          {/* Panel 2: reconstructed layout (editable in place) */}
          <div className="bg-paper rounded-2xl shadow-card overflow-hidden flex flex-col">
            <div className="px-5 py-3.5 border-b border-line/60 flex items-center gap-2">
              <span className="material-symbols-outlined text-primary">description</span>
              <h3 className="text-ink font-semibold text-sm">Reconstructed Layout</h3>
              {done && (
                <div className="ml-auto flex items-center gap-1">
                  {!editing ? (
                    <React.Fragment>
                      <button
                        onClick={startEdit}
                        className="inline-flex items-center gap-1 text-xs font-medium text-primary hover:text-primary-deep transition rounded-full border border-line px-3 py-1"
                        title="Correct this page directly in the layout — the fix is remembered for this document"
                      >
                        <span className="material-symbols-outlined text-base">edit</span> Edit
                      </button>
                      <button
                        onClick={copy}
                        className="inline-flex items-center gap-1 text-xs font-medium text-primary hover:text-primary-deep transition rounded-full border border-line px-3 py-1"
                        title="Copy the extracted text of the whole document"
                      >
                        <span className="material-symbols-outlined text-base">{copied ? "check" : "content_copy"}</span>
                        {copied ? "Copied" : "Copy"}
                      </button>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <button
                        onClick={cancelEdit}
                        disabled={save.status === "saving"}
                        className="rounded-full border border-line text-ink-soft text-xs font-medium px-4 py-1 hover:bg-mint-2 transition disabled:opacity-40"
                      >
                        Cancel
                      </button>
                      <button
                        onClick={saveLayoutEdit}
                        disabled={save.status === "saving"}
                        className="rounded-full bg-primary text-white text-xs font-semibold px-4 py-1 transition hover:opacity-90 disabled:opacity-40 disabled:cursor-wait"
                        title="Save your corrections (Ctrl+Enter)"
                      >
                        {save.status === "saving" ? "Saving…" : "Save"}
                      </button>
                    </React.Fragment>
                  )}
                </div>
              )}
            </div>
            <div className="flex-1 p-4 overflow-auto max-h-[560px]">
              {!done ? (
                <PanelBusy status={status} error={doc.error} />
              ) : (
                <React.Fragment>
                  {result && result.raw_text_corrected && !editing && (
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                      <span className="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full px-3 py-1">
                        <span className="material-symbols-outlined text-sm">verified</span> corrected version
                      </span>
                      <button
                        disabled={save.status === "saving"}
                        onClick={revertRaw}
                        className="inline-flex items-center gap-1 text-[11px] font-medium text-red-600 border border-red-200 rounded-full px-3 py-1 hover:bg-red-50 transition disabled:opacity-40"
                        title="Delete this correction and restore the original extracted text"
                      >
                        <span className="material-symbols-outlined text-sm">undo</span>
                        {save.status === "saving" ? "Reverting…" : "Revert to original"}
                      </button>
                    </div>
                  )}
                  {result && result.autocorrections && result.autocorrections.length > 0 && (
                    <p className="text-[11px] text-sky-700 bg-sky-50 border border-sky-200 rounded-full inline-flex px-3 py-1 mb-2 font-medium">
                      Dictionary auto-corrections: {result.autocorrections.map((a) => `${a.from} → ${a.to}`).join(", ")}
                    </p>
                  )}
                  {result && result.medgemma_corrections && result.medgemma_corrections.length > 0 && (
                    <p className="text-[11px] text-violet-700 bg-violet-50 border border-violet-200 rounded-full inline-flex px-3 py-1 mb-2 font-medium">
                      MedGemma corrected {result.medgemma_corrections.length} medical word{result.medgemma_corrections.length === 1 ? "" : "s"} (marked with *): {result.medgemma_corrections.map((a) => `${a.from} → ${a.to}`).join(", ")}
                    </p>
                  )}
                  {save.msg && (
                    <p className={"text-xs font-medium mb-2 " + (save.status === "error" ? "text-red-600" : "text-emerald-600")}>
                      {save.msg}
                    </p>
                  )}
                  {pages.length > 1 && (
                    <div className="flex flex-wrap gap-1.5 mb-3">
                      {pages.map((p, i) => (
                        <button
                          key={p.page}
                          disabled={editing}
                          onClick={() => setPageIdx(i)}
                          title={editing ? "Finish editing this page first" : undefined}
                          className={
                            "rounded-full border px-3 py-1 text-xs font-medium transition " +
                            (i === curIdx ? "bg-primary text-white border-primary" : "border-line text-primary hover:bg-mint-2") +
                            (editing ? " opacity-40 cursor-not-allowed" : "")
                          }
                        >
                          Page {p.page}
                        </button>
                      ))}
                    </div>
                  )}
                  {page && page.layout_html ? (
                    <React.Fragment>
                      <div className="mb-2">
                        {editing ? (
                          <span className="inline-flex items-center gap-1 text-[11px] font-medium text-amber-700 bg-amber-50 border border-amber-300 rounded-full px-3 py-1">
                            <span className="material-symbols-outlined text-sm">edit</span>
                            Editing — click into the text to correct it, then Save (Ctrl+Enter). Esc cancels.
                          </span>
                        ) : uncCount > 0 ? (
                          <span className="inline-flex items-center gap-1 text-[11px] font-medium text-amber-700 bg-amber-50 border border-amber-300 rounded-full px-3 py-1">
                            <span className="material-symbols-outlined text-sm">warning</span>
                            {uncCount} uncertain word{uncCount === 1 ? "" : "s"} highlighted in yellow — please verify {uncCount === 1 ? "it" : "these"}
                          </span>
                        ) : (
                          <span className="inline-flex items-center gap-1 text-[11px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full px-3 py-1">
                            <span className="material-symbols-outlined text-sm">check_circle</span>
                            No uncertain words on this page
                          </span>
                        )}
                      </div>
                      <LayoutFrame
                        html={page.layout_html}
                        editable={editing}
                        frameRef={frameRef}
                        keyActionsRef={keyActionsRef}
                      />
                    </React.Fragment>
                  ) : (
                    <p className="text-ink-soft text-sm italic p-2">
                      {(page && page.layout_error) || "No layout reconstruction available for this page."}
                    </p>
                  )}
                </React.Fragment>
              )}
            </div>
            {done && (
              <div className="px-5 py-3 border-t border-line/60 flex flex-wrap gap-2 items-center">
                <span className="text-[11px] font-medium text-primary-deep bg-mint-2 rounded-full px-3 py-1">
                  {pages.length} page{pages.length === 1 ? "" : "s"}
                </span>
                <div className="ml-auto flex items-center gap-2">
                  <button
                    onClick={handleDownloadPdf}
                    disabled={pdfBusy}
                    className="inline-flex items-center gap-1 text-[11px] font-medium text-primary-deep bg-mint-2 rounded-full px-3 py-1 hover:bg-mint transition disabled:opacity-60 disabled:cursor-wait"
                    title="Download the reconstructed layout of every page as a single PDF"
                  >
                    <span className={"material-symbols-outlined text-sm" + (pdfBusy ? " animate-spin" : "")}>
                      {pdfBusy ? "progress_activity" : "picture_as_pdf"}
                    </span>
                    {pdfBusy ? "Rendering " + pdfNote : "PDF"}
                  </button>
                  <button
                    onClick={() => downloadWord(doc)}
                    className="inline-flex items-center gap-1 text-[11px] font-medium text-primary-deep bg-mint-2 rounded-full px-3 py-1 hover:bg-mint transition"
                    title="Download the reconstructed layout of every page as a Word document"
                  >
                    <span className="material-symbols-outlined text-sm">description</span>
                    Word
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ReviewPage({ docs, onBack, onNext, onRawTextSaved, onRawTextReverted }) {
      const [selectedId, setSelectedId] = useState(docs.length ? docs[docs.length - 1].id : null);

      useEffect(() => {
        if (!docs.some((d) => d.id === selectedId)) {
          setSelectedId(docs.length ? docs[docs.length - 1].id : null);
        }
      }, [docs]);

      const sel = docs.find((d) => d.id === selectedId) || null;

      return (
        <div className="animate-fadeIn max-w-6xl mx-auto">
          <DocChips docs={docs} selectedId={selectedId} onSelect={setSelectedId} />

          {sel && <ExtractionCard key={sel.id} doc={sel} onRawTextSaved={onRawTextSaved} onRawTextReverted={onRawTextReverted} />}

          <div className="flex justify-between mt-8">
            <button
              onClick={onBack}
              className="rounded-full border-2 border-primary text-primary font-semibold text-sm px-7 py-2.5 hover:bg-mint-2 transition flex items-center gap-1.5"
            >
              <span className="material-symbols-outlined text-lg">arrow_back</span> New Upload
            </button>
            <button
              onClick={onNext}
              className="rounded-full bg-gradient-to-r from-primary to-accent text-white font-semibold text-sm px-7 py-2.5 shadow-card hover:opacity-90 transition flex items-center gap-1.5"
            >
              View Structured Data <span className="material-symbols-outlined text-lg">arrow_forward</span>
            </button>
          </div>
        </div>
      );
    }

    /* ── Page 3 — Structured table (placeholder) ─────────────── */
    function Shimmer({ w }) {
      return <div className={"h-3.5 rounded-full shimmer-bar animate-shimmer " + w} />;
    }

    function StructuredPage({ docs, onBack, onRestart }) {
      const [selectedId, setSelectedId] = useState(docs.length ? docs[docs.length - 1].id : null);

      useEffect(() => {
        if (!docs.some((d) => d.id === selectedId)) {
          setSelectedId(docs.length ? docs[docs.length - 1].id : null);
        }
      }, [docs]);

      const sel = docs.find((d) => d.id === selectedId) || null;
      const result = (sel && sel.result) || {};
      const fields = result.fields || [];
      const medicines = result.medicines || [];
      const busy = sel && (sel.status === "queued" || sel.status === "extracting");
      const done = sel && sel.status === "processed";

      return (
        <div className="animate-fadeIn max-w-5xl mx-auto">
          <DocChips docs={docs} selectedId={selectedId} onSelect={setSelectedId} />

          <div className="bg-paper rounded-2xl shadow-card overflow-hidden">
            <div className="px-6 py-4 border-b border-line/60 flex flex-wrap items-center gap-3">
              <span className="material-symbols-outlined text-primary">table_chart</span>
              <h3 className="text-ink font-semibold">Structured Prescription Data</h3>
              {sel && (
                <span className="ml-auto text-xs text-ink-soft truncate max-w-[40%]">{sel.file.name}</span>
              )}
            </div>

            {/* Header fields */}
            <div className="grid sm:grid-cols-3 gap-4 px-6 py-5 border-b border-line/60">
              {[["Patient Name", "patient_name"], ["Doctor Name", "doctor_name"], ["Prescription Date", "prescription_date"]].map(([label, key]) => (
                <div key={key} className="bg-mint rounded-xl border border-line/60 px-4 py-3">
                  <p className="text-[11px] font-semibold text-ink-soft uppercase tracking-wide mb-2">{label}</p>
                  {busy ? (
                    <Shimmer w="w-3/4" />
                  ) : (
                    <p className="text-ink text-sm font-medium">{fieldByKey(fields, key) || "—"}</p>
                  )}
                </div>
              ))}
            </div>

            {/* Medicines */}
            <div className="px-6 pt-4 pb-1">
              <p className="text-[11px] font-semibold text-ink-soft uppercase tracking-wide">Medicines</p>
            </div>
            {busy ? (
              <div className="px-6 pb-5"><Shimmer w="w-full" /></div>
            ) : medicines.length > 0 ? (
              <MedsTable medicines={medicines} />
            ) : (
              <p className="text-ink-soft text-sm italic px-6 pb-4">No medicines detected on this document.</p>
            )}

            {/* All extracted fields */}
            <div className="px-6 pt-4 pb-1 border-t border-line/40">
              <p className="text-[11px] font-semibold text-ink-soft uppercase tracking-wide">All Extracted Fields</p>
            </div>
            {busy ? (
              <div className="px-6 pb-5"><Shimmer w="w-full" /></div>
            ) : fields.length > 0 ? (
              <FieldsTable fields={fields} />
            ) : (
              <p className="text-ink-soft text-sm italic px-6 pb-4">
                {result.fields_error || (sel ? "No structured fields detected." : "Upload a document to see structured data.")}
              </p>
            )}

            <div className="px-6 py-4 border-t border-line/60 flex items-center justify-between">
              <p className="text-xs text-ink-soft italic">
                Values are verbatim from the document; to correct mistakes, click Edit on the Review page and fix the layout.
              </p>
              <button
                disabled={!done}
                onClick={() => done && exportCsv(sel)}
                className={
                  "rounded-full bg-gradient-to-r from-primary to-accent text-white font-semibold text-sm px-6 py-2.5 flex items-center gap-1.5 transition " +
                  (done ? "shadow-card hover:opacity-90" : "opacity-40 cursor-not-allowed")
                }
                title={done ? "Download structured data as CSV" : "Available once this document is processed"}
              >
                <span className="material-symbols-outlined text-lg">download</span> Export
              </button>
            </div>
          </div>

          <div className="flex justify-between mt-8">
            <button
              onClick={onBack}
              className="rounded-full border-2 border-primary text-primary font-semibold text-sm px-7 py-2.5 hover:bg-mint-2 transition flex items-center gap-1.5"
            >
              <span className="material-symbols-outlined text-lg">arrow_back</span> Back to Review
            </button>
            <button
              onClick={onRestart}
              className="rounded-full border-2 border-primary text-primary font-semibold text-sm px-7 py-2.5 hover:bg-mint-2 transition flex items-center gap-1.5"
            >
              <span className="material-symbols-outlined text-lg">restart_alt</span> Start Over
            </button>
          </div>
        </div>
      );
    }

    /* ── App shell ───────────────────────────────────────────── */
    function App() {
      const [step, setStep] = useState(1);
      const [docs, setDocs] = useState([]); // [{ id, file, status, result, error }]

      // edited = {pageIdx, html, text}: the page the user corrected directly
      // in the layout — their exact HTML wins over regex patching there.
      const onRawTextSaved = (docId, newText, pairs, edited) =>
        setDocs((ds) => ds.map((d) => {
          if (d.id !== docId) return d;
          let pages = (d.result && d.result.pages) || [];
          if (pairs && pairs.length) {
            // Patch corrected words into the layout too, keeping the model's
            // original so Revert can restore it. Anchor-first: replace the
            // predicted value only right after its field label, so a
            // corrected '(blank)' never touches other blank fields; global
            // whole-word replace is the fallback for normal words only.
            const escRx = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            pages = pages.map((p) => {
              if (!p.layout_html) return p;
              let html = p.layout_html;
              pairs.forEach(([pred, corr, anchor]) => {
                const predRx = new RegExp("(?<![A-Za-z0-9])" + escRx(pred) + "(?![A-Za-z0-9])");
                let done = false;
                const words = (anchor || "").match(/[A-Za-z0-9]+/g) || [];
                const gap = "(?:<[^>]*>|[^A-Za-z0-9<])*";
                // Anchor may start with stray words from the previous line —
                // try progressively shorter suffixes until one matches.
                for (let k = 0; k < words.length; k++) {
                  const am = html.match(new RegExp(words.slice(k).map(escRx).join(gap), "i"));
                  if (!am) continue;
                  const start = am.index + am[0].length;
                  const windowStr = html.slice(start, start + 300);
                  // Human-verified value wins. Candidates: exact predicted
                  // value, '(blank)', or a handwritten span — whichever sits
                  // NEAREST to the label is this field's value.
                  const cands = [];
                  const pm = windowStr.match(predRx);
                  if (pm) cands.push([pm.index, pm.index + pm[0].length]);
                  if (pred !== "(blank)") {
                    const bm = windowStr.match(/\(blank\)/);
                    if (bm) cands.push([bm.index, bm.index + bm[0].length]);
                  }
                  const hw = windowStr.match(/(<span class="hw">)([^<]{1,20})(<\/span>)/);
                  if (hw) cands.push([hw.index + hw[1].length, hw.index + hw[1].length + hw[2].length]);
                  if (cands.length) {
                    cands.sort((a, b) => a[0] - b[0]);
                    const s = start + cands[0][0], e = start + cands[0][1];
                    html = html.slice(0, s) + corr + html.slice(e);
                    done = true;
                  }
                  break; // anchor matched — don't retry riskier shorter suffixes
                }
                if (!done && pred.indexOf("(blank)") < 0 && pred.indexOf("[illegible]") < 0) {
                  html = html.replace(new RegExp(predRx.source, "g"), () => corr);
                }
              });
              return { ...p, _orig_layout: p._orig_layout || p.layout_html, layout_html: html };
            });
          }
          if (edited && pages[edited.pageIdx]) {
            pages = pages.map((p, i) => i !== edited.pageIdx ? p : {
              ...p,
              _orig_layout: p._orig_layout || p.layout_html,
              _orig_text: p._orig_text || p.text,
              layout_html: edited.html,
              text: edited.text,
            });
          }
          const wasCorrected = !!(d.result && d.result.raw_text_corrected);
          const textChanged = newText !== ((d.result && d.result.raw_text) || "");
          return { ...d, result: { ...d.result, pages, raw_text: newText, raw_text_corrected: textChanged || wasCorrected } };
        }));

      const onRawTextReverted = (docId, originalText) =>
        setDocs((ds) => ds.map((d) => {
          if (d.id !== docId) return d;
          const pages = ((d.result && d.result.pages) || []).map((p) =>
            (p._orig_layout || p._orig_text) ? {
              ...p,
              layout_html: p._orig_layout || p.layout_html,
              text: p._orig_text || p.text,
              _orig_layout: undefined,
              _orig_text: undefined,
            } : p
          );
          return { ...d, result: { ...d.result, pages, raw_text: originalText, raw_text_corrected: false } };
        }));
      const [engine, setEngine] = useState("");
      const nextId = useRef(0);
      const queueRef = useRef([]);   // docs waiting to be extracted
      const busyRef = useRef(false); // one extraction in flight at a time

      useEffect(() => {
        fetch(api("/api/health")).then((r) => r.json()).then((d) => setEngine(d.engine || "")).catch(() => {});
      }, []);

      const pump = () => {
        if (busyRef.current) return;
        const item = queueRef.current.shift();
        if (!item) return;
        busyRef.current = true;
        setDocs((ds) => ds.map((d) => (d.id === item.id ? { ...d, status: "extracting" } : d)));
        (async () => {
          try {
            // Step 1 — POST the file, get a job_id back immediately (no timeout risk)
            const fd = new FormData();
            fd.append("file", item.file, item.file.name);
            const res = await fetch(api("/api/extract"), { method: "POST", body: fd });
            const startData = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(startData.detail || startData.error || `Server error (${res.status})`);

            const jobId = startData.job_id;
            if (!jobId) throw new Error("Server did not return a job_id");

            // Step 2 — Poll GET /api/jobs/{job_id} until done or error
            const POLL_INTERVAL_MS = 4000;
            const MAX_POLLS = 900; // 4s × 900 = 60 min max
            for (let attempt = 0; attempt < MAX_POLLS; attempt++) {
              await new Promise((r) => setTimeout(r, POLL_INTERVAL_MS));
              const pollRes = await fetch(api(`/api/jobs/${jobId}`));
              const data = await pollRes.json().catch(() => ({}));
              if (!pollRes.ok) throw new Error(data.detail || `Poll error (${pollRes.status})`);
              if (data.status === "done") {
                setDocs((ds) => ds.map((d) => (d.id === item.id ? { ...d, status: "processed", result: data } : d)));
                return; // success — finally block handles cleanup
              }
              if (data.status === "error") {
                throw new Error(data.error || "Extraction failed on server");
              }
              // status is "queued" or "running" — keep polling
            }
            throw new Error("Extraction timed out after 60 minutes");
          } catch (e) {
            setDocs((ds) => ds.map((d) => (d.id === item.id ? { ...d, status: "error", error: String(e.message || e) } : d)));
          } finally {
            busyRef.current = false;
            if (queueRef.current.length > 0) {
              pump();
            } else {
              // Queue drained — move to Review if the user is still on Upload.
              setStep((s) => (s === 1 ? 2 : s));
            }
          }
        })();
      };

      const addFiles = (files) => {
        const items = files.map((f) => {
          nextId.current += 1;
          return { id: nextId.current, file: f, status: "queued", result: null, error: "" };
        });
        setDocs((ds) => [...ds, ...items]);
        queueRef.current.push(...items);
        pump();
      };

      const newUpload = () => setStep(1);
      const clearAll = () => { queueRef.current = []; setDocs([]); setStep(1); };
      const [showDictionary, setShowDictionary] = useState(false);

      return (
        <div className="min-h-screen flex flex-col">
          <Header engine={engine} onDictionary={() => setShowDictionary((v) => !v)} />
          <main className="flex-1 max-w-6xl w-full mx-auto px-6 pb-14">
            <Stepper step={step} />
            {showDictionary && <DictionaryPanel onClose={() => setShowDictionary(false)} />}
            {step === 1 && (
              <UploadPage docs={docs} onFilesAdded={addFiles} onView={() => setStep(2)} />
            )}
            {step === 2 && docs.length > 0 && (
              <ReviewPage docs={docs} onBack={newUpload} onNext={() => setStep(3)} onRawTextSaved={onRawTextSaved} onRawTextReverted={onRawTextReverted} />
            )}
            {step === 3 && (
              <StructuredPage docs={docs} onBack={() => setStep(2)} onRestart={clearAll} />
            )}
          </main>
          <footer className="text-center text-xs text-ink-soft/70 pb-6">
            {APP_TITLE} · demo build
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
